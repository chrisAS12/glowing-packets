[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packetsentinel"
version = "0.1.0"
description = "Real-time Windows packet & DNS threat monitor using Wireshark/tshark and open-source threat feeds."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "psutil>=7.2.2,<8.0.0",
]

[project.scripts]
packetsentinel = "packetsentinel.cli:main"
